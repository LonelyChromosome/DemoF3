<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>html,body{margin:0;background:#050913;overflow:hidden}*{box-sizing:border-box}</style></head><body><div id="pa-link-vfx" class="viz-dotted-background">
  <div class="pa-stage" role="img" aria-label="Thẻ hologram P Agent lơ lửng và xoay nhẹ từ trái sang phải, sau đó flip mạnh để chuyển Authorizing sang Authorized.">
    <canvas class="pa-field" aria-hidden="true"></canvas>
    <div class="pa-top"><span>BPA / CARD LINK</span><span class="pa-phase">INITIALIZING</span></div>
    <div class="pa-perspective">
      <div class="pa-float"><div class="pa-card">
        <div class="pa-face pa-front">
          <div class="pa-face-top"><span>PHENIKAA</span><span>LINK / 01</span></div>
          <div class="pa-emblem">P<span>AGENT</span></div>
          <div class="pa-chip"><i></i><i></i><i></i></div>
          <div class="pa-name pa-identity">Unknown</div>
          <div class="pa-state">Authorizing<span class="pa-dots">...</span></div>
          <div class="pa-meter"><div></div></div>
          <div class="pa-bottom"><span>IDENTITY BRIDGE</span><span>•••• 0426</span></div>
          <div class="pa-scan"></div>
        </div>
        <div class="pa-face pa-back">
          <div class="pa-face-top"><span>PHENIKAA</span><span>LINK / OK</span></div>
          <div class="pa-emblem">P<span>AGENT</span></div>
          <div class="pa-confirm"><span aria-hidden="true">✓</span></div>
          <div class="pa-name">Dao Nguyen</div>
          <div class="pa-state">Authorized</div>
          <div class="pa-linked">Đã liên kết thẻ</div>
          <div class="pa-bottom"><span>IDENTITY VERIFIED</span><span>SECURE</span></div>
          <div class="pa-scan"></div>
        </div>
      </div></div>
    </div>
    <div class="pa-flash"></div>
    <div class="pa-caption" aria-live="polite">Đang xác thực liên kết</div>
    
  </div>
</div>
<style>
#pa-link-vfx {font-family:Inter,Arial,sans-serif;padding:0;color:#d9fbff;}
#pa-link-vfx .pa-stage {position:relative;height:480px;max-width:680px;margin:auto;overflow:hidden;border-radius:22px;background:radial-gradient(ellipse at 50% 48%,#103347 0%,#08131f 45%,#050913 85%);--cyan:#66edff;--lime:#ceff62;--pink:#fc71d6;}
#pa-link-vfx .pa-field {position:absolute;inset:0;width:100%;height:100%;}
#pa-link-vfx .pa-top {position:absolute;top:24px;left:24px;right:24px;display:flex;justify-content:space-between;gap:8px;font:11px monospace;letter-spacing:1.5px;color:#84a8b7;}
#pa-link-vfx .pa-phase {color:var(--cyan);}
#pa-link-vfx .pa-perspective {position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:950px;}
#pa-link-vfx .pa-float {width:210px;height:292px;transform-style:preserve-3d;}
#pa-link-vfx .pa-card {position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform;}
#pa-link-vfx .pa-face {box-sizing:border-box;position:absolute;inset:0;padding:19px 18px;border:1px solid #73e9ffaa;border-radius:19px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:linear-gradient(135deg,#164357f2,#091728f7 55%,#162443f2);box-shadow:0 0 26px #53e4ff23,inset 0 0 30px #66eaff0d;color:#dbfaff;}
#pa-link-vfx .pa-face:before {content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#80e5ff06 3px 4px),linear-gradient(125deg,#b0ffff19,transparent 35%,transparent 64%,#d273ff15);}
#pa-link-vfx .pa-face:after {content:'';position:absolute;inset:8px;border:1px solid #8aefff20;border-radius:12px;pointer-events:none;}
#pa-link-vfx .pa-back {transform:rotateY(180deg);border-color:#cbff75aa;background:linear-gradient(135deg,#214447f5,#091e2cf7 60%,#20352bf5);box-shadow:0 0 36px #bdff6229,inset 0 0 30px #b7ff6210;}
#pa-link-vfx .pa-face-top,.pa-bottom {display:flex;justify-content:space-between;position:relative;font:9px monospace;letter-spacing:1px;color:#9bbfca;}
#pa-link-vfx .pa-emblem {position:absolute;top:49px;left:21px;font-size:86px;font-weight:500;line-height:1;letter-spacing:-7px;color:#91efff;text-shadow:3px 0 #fd71d641,-3px 0 #61eaff45,0 0 25px #58daff4d;}
#pa-link-vfx .pa-emblem span {display:block;font:10px monospace;letter-spacing:6px;margin:6px 0 0 5px;color:#b3d5e1;}
#pa-link-vfx .pa-chip {position:absolute;right:22px;top:89px;width:35px;height:29px;border:1px solid #81e4ff66;border-radius:6px;display:flex;flex-direction:column;justify-content:space-evenly;padding:3px;box-sizing:border-box;}
#pa-link-vfx .pa-chip i {height:1px;background:#80eaff55;}
#pa-link-vfx .pa-name {position:absolute;left:21px;right:18px;top:177px;font-size:23px;letter-spacing:-.6px;font-weight:500;white-space:nowrap;overflow:hidden;max-height:41px;}
#pa-link-vfx .pa-state {position:absolute;left:21px;top:215px;font:14px monospace;letter-spacing:.3px;color:var(--cyan);}
#pa-link-vfx .pa-back .pa-state {color:var(--lime);}
#pa-link-vfx .pa-linked {position:absolute;left:21px;top:238px;font-size:11px;color:#a8c8bc;}
#pa-link-vfx .pa-meter {position:absolute;top:244px;left:21px;right:21px;height:2px;background:#8ae8ff19;}
#pa-link-vfx .pa-meter div {height:100%;background:var(--cyan);box-shadow:0 0 8px #60eaff;transform-origin:left;}
#pa-link-vfx .pa-bottom {position:absolute;bottom:16px;left:21px;right:21px;font-size:8px;}
#pa-link-vfx .pa-confirm {position:absolute;top:91px;right:22px;width:34px;height:34px;display:grid;place-items:center;color:var(--lime);border:1px solid #c8ff6577;border-radius:50%;box-shadow:0 0 18px #c8ff6522;}
#pa-link-vfx .pa-confirm svg {width:21px;height:21px;}
#pa-link-vfx .pa-scan {position:absolute;left:0;right:0;height:55px;background:linear-gradient(transparent,#97f8ff19,transparent);pointer-events:none;}
#pa-link-vfx .pa-caption {position:absolute;bottom:66px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.3px;color:#94b6c6;}
#pa-link-vfx .pa-replay {position:absolute;bottom:20px;left:50%;transform:translateX(-50%);min-height:32px;padding:6px 15px;border:1px solid #7596a13f;background:#12202c;color:#bfdae4;border-radius:20px;font:12px Arial;}
#pa-link-vfx .pa-flash {position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#d6ffa877,transparent 65%);opacity:0;}
@media(max-width:400px){#pa-link-vfx .pa-top{left:16px;right:16px;letter-spacing:.7px}#pa-link-vfx .pa-stage{height:480px}}
</style>
<script>
(() => {
 const root=document.getElementById('pa-link-vfx'),stage=root.querySelector('.pa-stage'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
 function fitName(el,name){
  name=String(name||'').trim().replace(/\s+/g,' ');
  if(el.dataset.fitted===name)return;
  el.dataset.fitted=name;
  const measure=document.createElement('canvas').getContext('2d'),limit=169;
  const width=(s,size)=>{measure.font=`500 ${size}px Arial`;return measure.measureText(s).width;};
  let size=23,lines=[name];
  while(size>16&&width(name,size)>limit)size--;
  if(width(name,size)>limit){
   const words=name.split(' ');let best=null;
   for(let i=1;i<words.length;i++){
    const a=words.slice(0,i).join(' '),b=words.slice(i).join(' '),score=Math.max(width(a,18),width(b,18));
    if(!best||score<best.score)best={lines:[a,b],score};
   }
   lines=best?best.lines:[name.slice(0,Math.ceil(name.length/2)),name.slice(Math.ceil(name.length/2))];
   size=18;while(size>10&&Math.max(...lines.map(s=>width(s,size)))>limit)size--;
  }
  el.textContent=lines.join('\n');el.style.fontSize=size+'px';el.style.lineHeight='1.12';
  el.style.top=lines.length===2?'167px':'177px';el.style.whiteSpace='pre-line';
  el.style.letterSpacing='0';el.style.overflow='hidden';el.style.maxHeight='41px';
  const widest=Math.max(...lines.map(s=>width(s,size)));
  el.style.transform=widest>limit?`scaleX(${limit/widest})`:'none';el.style.transformOrigin='left center';
 }
 const card=root.querySelector('.pa-card'),floating=root.querySelector('.pa-float'),phase=root.querySelector('.pa-phase'),caption=root.querySelector('.pa-caption'),dots=root.querySelector('.pa-dots'),meter=root.querySelector('.pa-meter div'),flash=root.querySelector('.pa-flash'),scans=root.querySelectorAll('.pa-scan');
 const identity=root.querySelector('.pa-identity');let displayName='',started=null,alreadyBound=false;
 window.paSetState=(state,name)=>{displayName=name||'';fitName(root.querySelector('.pa-back .pa-name'),displayName);if(state==='bound'){alreadyBound=true;done=true;}else if(state==='accepted'&&started===null){started=performance.now();}};
 let width=0,height=0,start=performance.now(),done=false;
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function resize(){width=stage.clientWidth;height=stage.clientHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=width*d;canvas.height=height*d;ctx.setTransform(d,0,0,d,0,0);}
 new ResizeObserver(resize).observe(stage);resize();

 const clamp=v=>Math.max(0,Math.min(1,v));
 function frame(now){
  if(!root.isConnected)return;
  const ambient=(now-start)/1000,t=alreadyBound?6:started===null?0:(now-started)/1000,flip=clamp((t-4.3)/1.15),locked=t>=5.45;
  let yaw;
  if(t<3.8)yaw=24*Math.sin(ambient*1.45-.6);
  else if(t<4.3){const p=(t-3.8)/.5;const begin=24*Math.sin((ambient-t+3.8)*1.45-.6);yaw=begin+(-42-begin)*p*p;}
  else if(t<5.45){const e=flip<.5?4*flip*flip*flip:1-Math.pow(-2*flip+2,3)/2;yaw=-42+582*e;}
  else {const s=t-5.45;yaw=540+Math.sin(s*9)*12*Math.exp(-s*4)+Math.sin(ambient*1.3)*8*(1-Math.exp(-s));}
  if(reduce)yaw=locked?540:0;
  floating.style.transform=`translateY(${reduce?0:Math.sin(ambient*1.7)*9-5}px)`;
  card.style.transform=`rotateY(${yaw}deg) rotateX(${reduce?0:3}deg)`;
  const reveal=clamp((t-2.65)/.65);
  fitName(identity,t<2.65?'Unknown':t<3.3?displayName.slice(0,Math.floor(reveal*displayName.length))+'▍':displayName);
  identity.style.color=t<2.65?'#91b0bf':'#dbfaff';
  identity.style.textShadow=t>=2.65&&t<3.6?'0 0 14px #66edff80':'none';
  dots.textContent='.'.repeat(1+Math.floor(ambient*2)%3);meter.style.transform=`scaleX(${clamp(t/4.3)})`;
  scans.forEach(s=>s.style.transform=`translateY(${(ambient*58)%350-55}px)`);
  const burst=locked?Math.exp(-(t-5.45)*4):0;
  flash.style.opacity=reduce?0:burst*.7;
  phase.textContent=locked?'LINK ESTABLISHED':started===null?'WAITING FOR CARD':t<1?'INITIALIZING':t<3.8?'VERIFYING IDENTITY':'AUTHORIZE';
  if(locked&&!done){done=true;caption.textContent='';window.flutter_inappwebview?.callHandler('vfxComplete');}if(alreadyBound)caption.textContent='';else if(started===null)caption.textContent='Đưa thẻ NFC lại gần điện thoại';
  ctx.clearRect(0,0,width,height);
  const cx=width/2,cy=height/2,ground=cy+166;
  const glow=ctx.createRadialGradient(cx,ground,0,cx,ground,160);glow.addColorStop(0,locked?'#bcff622e':'#61eaff28');glow.addColorStop(1,'#61eaff00');ctx.fillStyle=glow;ctx.fillRect(cx-180,ground-45,360,90);
  ctx.save();ctx.strokeStyle='#61eaff15';ctx.lineWidth=1;
  for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(cx+i*23,ground-26);ctx.lineTo(cx+i*64,ground+38);ctx.stroke();}
  for(let i=0;i<5;i++){let y=ground-26+i*i*4;ctx.beginPath();ctx.moveTo(cx-145-i*9,y);ctx.lineTo(cx+145+i*9,y);ctx.stroke();}ctx.restore();
  const colors=locked?['#caff72','#63edff']:['#63edff','#fc71d6'];
  for(let i=0;i<40;i++){
   const speed=reduce?0:ambient*(12+i%5*4),x=cx+Math.sin(i*24.21)*Math.min(width*.41,240),y=((i*47-speed)%height+height)%height;
   const away=Math.abs(x-cx)>125||Math.abs(y-cy)>164;
   if(!away)continue;
   ctx.globalAlpha=.12+(i%4)*.07;ctx.fillStyle=colors[i%2];
   if(i%4===0){ctx.font='10px monospace';ctx.fillText(i%8===0?'0101':'0xA'+(i%9),x,y);}else ctx.fillRect(x,y,i%3===0?9:2,2);
  }
  ctx.globalAlpha=1;
  if(burst>.01&&!reduce){for(let i=0;i<32;i++){let a=i*Math.PI/16,r=110+(t-5.45)*210;ctx.globalAlpha=burst;ctx.fillStyle=i%2?'#caff72':'#f77cdc';ctx.fillRect(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.7,4+(i%3)*3,2);}}
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
})();
</script>
</body></html>
