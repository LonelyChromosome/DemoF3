# GitHub's hosted runner has about 7 GiB of RAM. The previous 8 GiB heap plus
# a 4 GiB metaspace allowance could starve the runner agent during the combined
# unit-test/release build and make GitHub report a lost runner. Keep the build
# bounded while still leaving enough heap for R8 and Kotlin compilation.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
