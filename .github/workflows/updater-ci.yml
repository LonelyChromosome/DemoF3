name: Verify card updater branch

on:
  push:
    branches:
      - feature/1.2-card-update

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/app_update_manifest_test.dart test/app_update_controller_test.dart test/app_update_ui_test.dart test/app_smoke_test.dart
      - run: (cd android && ./gradlew :app:testDebugUnitTest)
      - run: flutter build apk --debug
