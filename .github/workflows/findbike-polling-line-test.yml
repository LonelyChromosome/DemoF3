name: Find My Bike Polling Line Test APK
on:
  push:
    branches:
      - find-bike/polling-line-test
    paths:
      - 'findbike-polling-line-test/**'
      - '.github/workflows/findbike-polling-line-test.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build real GPS polling test APK
        run: gradle -p findbike-polling-line-test --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FindMyBike-1.5-Polling-Line-Test-APK
          path: findbike-polling-line-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
