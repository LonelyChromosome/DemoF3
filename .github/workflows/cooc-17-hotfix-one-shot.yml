name: Publish cooc.1.7 hotfix 56

# One-time dispatch of the existing protected signed APK release workflow.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cooc-17-hotfix-one-shot.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: "github.event.head_commit.message == 'chore(release): trigger cooc.1.7 hotfix build 56'"
    runs-on: ubuntu-latest
    steps:
      - name: Request protected signed hotfix release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-apk.yml \
            --repo LonelyChromosome/DemoF3 \
            --ref main \
            --raw-field version_name=cooc.1.7 \
            --raw-field version_code=56 \
            --raw-field notes='cooc.1.7 (bản vá): Sửa lỗi Pull Reload timeout; khôi phục phiên QLĐT khi mở lại ứng dụng; giữ nguyên lịch học, tag vắng và Recap.' \
            --raw-field publish=true \
            --raw-field publish_confirmation=PUBLISH
