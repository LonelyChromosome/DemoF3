name: BPA 1.6 - profile test APK (no publish)

on:
  push:
    branches:
      - feature/1.6-alarm-bridge

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap Android
        run: bash tool/bootstrap.sh
      - name: Build single ARM64 profile APK
        run: |
          set -euo pipefail
          flutter build apk --profile --target-platform android-arm64 --build-number=35
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-profile.apk dist/BPA-1.6-Alarm-Bridge-ARM64-Test.apk
          sha256sum dist/BPA-1.6-Alarm-Bridge-ARM64-Test.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BPA-1.6-Alarm-Bridge-ARM64-Test
          path: |
            dist/BPA-1.6-Alarm-Bridge-ARM64-Test.apk
            dist/SHA256SUMS
          retention-days: 14
