name: BPA 1.6 - profile test APK (no publish)

on:
  push:
    branches:
      - feature/1.6-alarm-bridge
      - feature/cooc1.6-theme-dust-update-log

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap Android
        run: bash tool/bootstrap.sh
      - name: Isolate BPA 1.6 test installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          old = 'applicationId = "vn.edu.phenikaa.better_phenikaa_schedule"'
          assert s.count(old) == 1
          gradle.write_text(s.replace(old, 'applicationId = "vn.edu.phenikaa.better_phenikaa_schedule.alarmtest"'))
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          old = 'android:label="Better Phenikaa App"'
          assert s.count(old) == 1
          manifest.write_text(s.replace(old, 'android:label="BPA 1.6 Test"'))
          PY
      - name: Check new theme transition and notification code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/giao_dien/xem_truoc/theme_dust_transition.dart lib/features/giao_dien/xem_truoc/theme_picker.dart lib/theme/app_theme.dart lib/app/app.dart
      - name: Build single ARM64 profile APK
        run: |
          set -euo pipefail
          flutter build apk --profile --target-platform android-arm64 --build-number=48 --dart-define=BPA_ALARM_TEST_FIXTURE=false
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-profile.apk dist/BPA-1.6-Theme-Dust-Test.apk
          sha256sum dist/BPA-1.6-Theme-Dust-Test.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BPA-1.6-Theme-Dust-Test
          path: |
            dist/BPA-1.6-Theme-Dust-Test.apk
            dist/SHA256SUMS
          retention-days: 14
