name: BPA 1.6 - test signed APK (no publish)

on:
  push:
    branches:
      - feature/1.6-alarm-bridge

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/feature/1.6-alarm-bridge' }}
    runs-on: ubuntu-latest
    environment: cooc-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Restore protected signing key
        env:
          COOC_KEYSTORE_BASE64: ${{ secrets.COOC_KEYSTORE_BASE64 }}
          COOC_KEYSTORE_PASSWORD: ${{ secrets.COOC_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$COOC_KEYSTORE_BASE64" && test -n "$COOC_KEYSTORE_PASSWORD"
          echo "$COOC_KEYSTORE_BASE64" | base64 --decode > android/cooc-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=cooc-release-v2\nstoreFile=cooc-release.jks\n' \
            "$COOC_KEYSTORE_PASSWORD" "$COOC_KEYSTORE_PASSWORD" > android/key.properties
          chmod 600 android/key.properties android/cooc-release.jks
      - name: Bootstrap Android tooling
        run: |
          set -euo pipefail
          bash tool/bootstrap.sh
      - name: Build single APK
        env:
          COOC_VERSION_NAME: cooc.1.6
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-number=35 \
            --dart-define="UPDATE_PUBLIC_KEY_BASE64=$UPDATE_PUBLIC_KEY_BASE64"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/BPA-1.6-Alarm-Bridge-Test.apk
      - name: Verify signed output
        env:
          EXPECTED_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -s dist/BPA-1.6-Alarm-Bridge-Test.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          "$signer" verify --print-certs dist/BPA-1.6-Alarm-Bridge-Test.apk > dist/signing.txt
          if [[ -n "$EXPECTED_SHA256" ]]; then
            grep -iq "$EXPECTED_SHA256" dist/signing.txt
          fi
          sha256sum dist/BPA-1.6-Alarm-Bridge-Test.apk > dist/SHA256SUMS
      - name: Remove signing inputs
        if: always()
        run: rm -f android/key.properties android/cooc-release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: BPA-1.6-Alarm-Bridge-Test-APK
          path: |
            dist/BPA-1.6-Alarm-Bridge-Test.apk
            dist/SHA256SUMS
          retention-days: 14
