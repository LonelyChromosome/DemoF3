name: Publish Better Phenikaa 1.6
on:
  push:
    branches: [main]
    paths: [".github/workflows/release-bpa-1.6.yml"]
permissions:
  actions: write
  contents: read
jobs:
  dispatch-signed-release:
    if: github.repository == 'LonelyChromosome/DemoF3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch established updater release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run build-apk.yml --ref main \
            -f version_name=cooc.1.6 \
            -f version_code=45 \
            -f notes='cooc.1.6: Báo thức theo lịch học, liên kết thẻ NFC và hiệu ứng hologram.' \
            -f publish=true \
            -f publish_confirmation=PUBLISH
