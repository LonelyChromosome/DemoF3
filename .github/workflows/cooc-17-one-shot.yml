name: Publish cooc.1.7 one time

# Explicit, one-time user-authorized release request. Does not turn the
# regular signed-release workflow into an automatic push release.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cooc-17-one-shot.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'chore(release): trigger cooc.1.7 publish'
    runs-on: ubuntu-latest
    steps:
      - name: Request protected signed 1.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-apk.yml \
            --repo LonelyChromosome/DemoF3 \
            --ref main \
            --raw-field version_name=cooc.1.7 \
            --raw-field version_code=55 \
            --raw-field notes='cooc.1.7: Bổ sung Recap nhìn lại học kỳ với VFX Memory; thống kê ngày học, môn học và chuyên cần; cải tiến Pull Reload giữ phiên QLĐT; hoàn thiện giao diện và sửa lỗi.' \
            --raw-field publish=true \
            --raw-field publish_confirmation=PUBLISH
