name: cooc.1.4 signed update from tested 1.3 VFX - NO CODE CHANGES

on:
  push:
    branches:
      - feature/1.2-card-update
    paths:
      - .github/workflows/release-cooc-1-4-vfx-updater-once.yml

concurrency:
  group: cooc-1-4-vfx-update-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: cooc-release
    permissions:
      contents: write
    steps:
      - name: Checkout exact signed cooc.1.3 VFX source
        uses: actions/checkout@v5
        with:
          ref: fa218820908b6a6bc2d1579e12de3dff238f8854
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap Android and Flutter once
        run: bash tool/bootstrap.sh
      - name: Confirm the two production VFX without preview code
        run: |
          set -euo pipefail
          grep -q 'class HenshinVfx' lib/features/app_update/henshin_vfx.dart
          grep -q 'startManualAfterHold' lib/features/app_update/update_ui.dart
          grep -q '_nfcSuccessToken' lib/features/app_update/update_ui.dart
          ! grep -q 'COOC_13_VFX_PREVIEW' lib/features/app_update/update_ui.dart
          ! grep -q 'Xem thử VFX' lib/features/app_update/update_ui.dart
      - name: Restore the same APK signing key and update-manifest key
        env:
          COOC_KEYSTORE_BASE64: ${{ secrets.COOC_KEYSTORE_BASE64 }}
          COOC_KEYSTORE_PASSWORD: ${{ secrets.COOC_KEYSTORE_PASSWORD }}
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$COOC_KEYSTORE_BASE64" && test -n "$COOC_KEYSTORE_PASSWORD"
          test -n "$UPDATE_MANIFEST_PRIVATE_KEY_BASE64" && test -n "$UPDATE_PUBLIC_KEY_BASE64"
          test -n "$EXPECTED_APK_CERT_SHA256"
          echo "$COOC_KEYSTORE_BASE64" | base64 --decode > android/cooc-release.jks
          echo "$UPDATE_MANIFEST_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/update-manifest-private.pem"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=cooc-release-v2\nstoreFile=cooc-release.jks\n' \
            "$COOC_KEYSTORE_PASSWORD" "$COOC_KEYSTORE_PASSWORD" > android/key.properties
          chmod 600 android/cooc-release.jks android/key.properties "$RUNNER_TEMP/update-manifest-private.pem"
          derived="$(openssl pkey -in "$RUNNER_TEMP/update-manifest-private.pem" -pubout -outform DER | tail -c 32 | base64 -w 0)"
          test "$derived" = "$UPDATE_PUBLIC_KEY_BASE64"
      - name: Build only cooc.1.4 versionCode 36 with unchanged 1.3 feature source
        env:
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/LonelyChromosome/DemoF3/feature/1.2-card-update/updates/latest.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          s=p.read_text()
          dev='  integration_test:\n    sdk: flutter\n'
          if s.count(dev)!=1:
              raise SystemExit("Unexpected dev-only integration_test declaration")
          p.write_text(s.replace(dev,''))
          PY
          flutter pub get
          COOC_VERSION_NAME=cooc.1.4 flutter build apk --release --build-number=36 \
            --dart-define="UPDATE_PUBLIC_KEY_BASE64=$UPDATE_PUBLIC_KEY_BASE64" \
            --dart-define="UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.4-VFX-Update.apk
      - name: Verify APK signing certificate, application ID and version
        env:
          CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --print-certs dist/Better-Phenikaa-cooc.1.4-VFX-Update.apk > dist/signing.txt
          info="$("$aapt" dump badging dist/Better-Phenikaa-cooc.1.4-VFX-Update.apk)"
          [[ "$info" == *"package: name='vn.edu.phenikaa.better_phenikaa_schedule' versionCode='36' versionName='cooc.1.4'"* ]]
          fingerprint="$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' dist/signing.txt | sort -u)"
          test -n "$fingerprint" && test "${fingerprint,,}" = "${CERT_SHA256,,}"
          ! grep -q 'CN=Android Debug' dist/signing.txt
          sha256sum dist/Better-Phenikaa-cooc.1.4-VFX-Update.apk > dist/SHA256SUMS
      - name: Sign exact latest.json bytes with established Ed25519 key
        run: |
          set -euo pipefail
          url="https://github.com/LonelyChromosome/DemoF3/releases/download/cooc.1.4-vfx-check-fa21882/Better-Phenikaa-cooc.1.4-VFX-Update.apk"
          python3 tool/release_update_manifest.py dist/Better-Phenikaa-cooc.1.4-VFX-Update.apk "$url" dist/latest.json cooc.1.4 36 30 "cooc.1.4: Xác nhận nâng cấp từ 1.3. Không thay đổi chức năng."
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/update-manifest-private.pem" \
            -in dist/latest.json -out "$RUNNER_TEMP/latest.sig.bin"
          base64 -w 0 "$RUNNER_TEMP/latest.sig.bin" > dist/latest.json.sig
          openssl pkey -in "$RUNNER_TEMP/update-manifest-private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/public.pem" \
            -in dist/latest.json -sigfile "$RUNNER_TEMP/latest.sig.bin"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          apk=Path('dist/Better-Phenikaa-cooc.1.4-VFX-Update.apk')
          data=json.loads(Path('dist/latest.json').read_bytes())
          assert data['versionCode']==36 and data['versionName']=='cooc.1.4'
          assert data['minimumVersionCode']==30
          assert data['apkSha256']==hashlib.sha256(apk.read_bytes()).hexdigest()
          assert data['apkSize']==apk.stat().st_size
          assert data['apkUrl'].endswith('/cooc.1.4-vfx-check-fa21882/Better-Phenikaa-cooc.1.4-VFX-Update.apk')
          PY
      - name: Save signed 1.4 APK and matching metadata for recovery
        uses: actions/upload-artifact@v4
        with:
          name: cooc-1-4-update-test-from-1-3-signed
          retention-days: 14
          path: |
            dist/Better-Phenikaa-cooc.1.4-VFX-Update.apk
            dist/latest.json
            dist/latest.json.sig
            dist/SHA256SUMS
      - name: Verify current update feed and new tag before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "cooc.1.4-vfx-check-fa21882" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable release" >&2
            exit 1
          fi
          git fetch origin refs/heads/feature/1.2-card-update:refs/remotes/origin/feature/1.2-card-update
          git show origin/feature/1.2-card-update:updates/latest.json > "$RUNNER_TEMP/prior.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          prev=json.loads((Path(os.environ['RUNNER_TEMP'])/'prior.json').read_bytes())
          nxt=json.loads(Path('dist/latest.json').read_bytes())
          assert prev['packageName']==nxt['packageName']
          assert prev['versionCode']==32, "Latest changed since 1.2; refuse publish"
          assert nxt['versionCode']==36 and nxt['minimumVersionCode']==30
          PY
      - name: Publish cooc.1.4 release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "cooc.1.4-vfx-check-fa21882" dist/Better-Phenikaa-cooc.1.4-VFX-Update.apk \
            --target fa218820908b6a6bc2d1579e12de3dff238f8854 \
            --title "Better Phenikaa cooc.1.4 — NFC VFX updater check" \
            --notes "Release-signed target (code 36) built from the same source as cooc.1.3 (code 34). No functional changes; validates NFC and 2-second hold updating 1.3 to 1.4." \
            --latest
      - name: Publish the signed cooc.1.4 manifest to existing updater URL
        run: |
          set -euo pipefail
          git switch -C publish-cooc14-feed origin/feature/1.2-card-update
          mkdir -p updates
          cp dist/latest.json dist/latest.json.sig updates/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json updates/latest.json.sig
          git diff --cached --quiet && { echo "Nothing new to publish"; exit 1; } || true
          git commit -m "Publish cooc.1.4 signed update for cooc.1.3 NFC and hold test"
          git push origin HEAD:refs/heads/feature/1.2-card-update
      - name: Erase signing keys from GitHub runner
        if: always()
        run: |
          rm -f android/key.properties android/cooc-release.jks
          rm -f "$RUNNER_TEMP/update-manifest-private.pem" "$RUNNER_TEMP/public.pem" "$RUNNER_TEMP/latest.sig.bin"
