name: Cleanup obsolete branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in             diemdanh             feature/date-schedule-markers             fix/qldt-native-timeout             rewrite/qldt-login-native-sync
          do
            echo "Deleting $branch"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" || true
          done
