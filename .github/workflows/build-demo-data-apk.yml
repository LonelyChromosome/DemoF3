name: Build demo data APK

on:
  push:
    branches:
      - feature/big-update
    paths:
      - '.github/workflows/build-demo-data-apk.yml'
      - 'assets/demo/**'
      - 'lib/demo/**'
      - 'lib/main.dart'
      - 'pubspec.yaml'
      - 'android/app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/demo lib/main.dart test/demo_data_seed_test.dart
      - name: Test bundled data
        run: flutter test test/demo_data_seed_test.dart
      - name: Build separate demo APK
        env:
          ORG_GRADLE_PROJECT_betterPhenikaaDemo: 'true'
        run: flutter build apk --release --dart-define=BETTER_PHENIKAA_DEMO_DATA=true
      - name: Check artifact
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DemoF3-preloaded-data-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          retention-days: 14
          if-no-files-found: error
