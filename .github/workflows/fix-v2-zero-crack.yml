name: Fix Better Phenikaa v2 zero-crack widget

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-v2-zero-crack.yml'

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply zero-crack widget architecture
        run: python3 tool/fix_v2_zero_crack_current.py

      - name: Complete render-state declaration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt')
          text = path.read_text(encoding='utf-8')
          declaration = '        private const val WIDGET_RENDER_STATE_PREFS = "better_phenikaa_widget_render_state"\n'
          if declaration not in text:
              marker = '        const val WIDGET_SELECTION_PREFS = "better_phenikaa_widget_selection"\n'
              if marker not in text:
                  raise SystemExit('selection prefs marker missing')
              text = text.replace(marker, marker + declaration, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify zero-crack contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'partiallyUpdateAppWidget(widgetId, views)' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'collectionContentToken' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'if (bindCollection)' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'WIDGET_RENDER_STATE_PREFS = "better_phenikaa_widget_render_state"' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'Theme-independent transparent collection layer' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          ! grep -q 'canvas.drawRect(0f, 0f, widthPx, heightPx, backgroundPaint)' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -q 'android:visibility="gone"' platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          grep -q '^version: 2.0.4+9$' pubspec.yaml
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q 'edu.system.makeRequest' lib/features/qldt_intake/qldt_login_mobile.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.4.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.4.apk > dist/Better_Phenikaa_App_v2.0.4.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.4-zero-crack-final
          path: |
            dist/Better_Phenikaa_App_v2.0.4.apk
            dist/Better_Phenikaa_App_v2.0.4.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          git commit -m 'fix: make widget theme switches atomic without collection reload'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
