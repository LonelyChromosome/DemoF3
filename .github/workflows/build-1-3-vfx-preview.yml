name: Build cooc.1.3 NFC VFX isolated preview (NO PUBLISH)

on:
  push:
    branches:
      - feature/1.3-nfc-manual-henshin-vfx
    paths:
      - .github/workflows/build-1-3-vfx-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap Flutter and Android once
        run: bash tool/bootstrap.sh
      - name: Prepare build-only side-by-side application identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          text=path.read_text()
          needle='    buildTypes {\n        release {'
          assert text.count(needle)==1
          text=text.replace(needle,
              '    buildTypes {\n'
              '        debug {\n'
              '            applicationIdSuffix = ".preview13"\n'
              '            manifestPlaceholders["appLabel"] = "Better Phenikaa 1.3 VFX"\n'
              '        }\n'
              '        release {')
          path.write_text(text)
          PY
      - name: Build cooc.1.3 arm64 isolated debug APK — two VFX only
        run: |
          dart format lib/features/app_update/henshin_vfx.dart lib/features/app_update/update_ui.dart
          COOC_VERSION_NAME=cooc.1.3 flutter build apk --debug --split-per-abi \
            --build-name=1.3.0 --build-number=34 \
            --dart-define=COOC_13_VFX_PREVIEW=true
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk dist/Better-Phenikaa-cooc.1.3-NFC-VFX-Preview-arm64.apk
      - name: Verify side-by-side preview package, version and checksum
        run: |
          set -euo pipefail
          apk=dist/Better-Phenikaa-cooc.1.3-NFC-VFX-Preview-arm64.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          identity="$("$aapt" dump badging "$apk")"
          [[ "$identity" == *"package: name='vn.edu.phenikaa.better_phenikaa_schedule.preview13' versionCode='34'"* ]]
          echo "$identity" | grep '^package:'
          sha256sum "$apk" > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cooc-1-3-nfc-two-vfx-private-preview
          path: |
            dist/Better-Phenikaa-cooc.1.3-NFC-VFX-Preview-arm64.apk
            dist/SHA256SUMS
          retention-days: 14
