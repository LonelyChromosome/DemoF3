name: Fast signed cooc updater APK
on:
  push:
    branches:
      - feature/1.2-card-update
    paths:
      - .github/workflows/quickfix-apk.yml
      - android/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/UpdateBridge.kt
jobs:
  apk:
    environment: cooc-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - name: Prepare fixed cooc release signing
        env:
          KEY_BASE64: ${{ secrets.COOC_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.COOC_KEYSTORE_PASSWORD }}
          PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEY_BASE64" && test -n "$KEY_PASSWORD" && test -n "$PUBLIC_KEY" && test -n "$CERT_SHA256"
          echo "$KEY_BASE64" | base64 --decode > android/cooc-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=cooc-release-v2\nstoreFile=cooc-release.jks\n' "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
      - name: Build one signed APK without tests or publish
        env:
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/LonelyChromosome/DemoF3/feature/1.2-card-update/updates/latest.json
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f = Path('pubspec.yaml')
          s = f.read_text()
          match = '  integration_test:\n    sdk: flutter\n'
          assert s.count(match) == 1
          f.write_text(s.replace(match, ''))
          PY
          flutter pub get
          COOC_VERSION_NAME=cooc.1.1 flutter build apk --release --build-number=30 \
            --dart-define="UPDATE_PUBLIC_KEY_BASE64=$UPDATE_PUBLIC_KEY_BASE64" \
            --dart-define="UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.1-ManualNameFix.apk
      - name: Verify release certificate and version
        env:
          CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=dist/Better-Phenikaa-cooc.1.1-ManualNameFix.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          "$signer" verify --print-certs "$apk" > dist/signing.txt
          package="$("$aapt" dump badging "$apk")"
          [[ "$package" == *"package: name='vn.edu.phenikaa.better_phenikaa_schedule' versionCode='30' versionName='cooc.1.1'"* ]]
          fingerprint="$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' dist/signing.txt | sort -u)"
          test "${fingerprint,,}" = "${CERT_SHA256,,}"
          sha256sum "$apk" > dist/SHA256.txt
      - name: Erase signing key
        if: always()
        run: rm -f android/cooc-release.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: signed-cooc-1-1-manual-name-fix
          path: |
            dist/Better-Phenikaa-cooc.1.1-ManualNameFix.apk
            dist/SHA256.txt
          retention-days: 14
