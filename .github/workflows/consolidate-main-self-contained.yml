name: Consolidate main self-contained source

on:
  push:
    branches:
      - chore/main-self-contained
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidate-main-self-contained
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Materialize Android scaffold from main source
        run: bash tool/bootstrap.sh

      - name: Format source
        run: dart format lib test

      - name: Commit generated wrapper and formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Make main build source self-contained'
            git pull --rebase origin chore/main-self-contained
            git push origin HEAD:chore/main-self-contained
          fi
