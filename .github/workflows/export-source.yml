name: Export source snapshot

on:
  push:
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git --exclude=build -czf demof3-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: demof3-source
          path: demof3-source.tar.gz
          if-no-files-found: error
          retention-days: 1
