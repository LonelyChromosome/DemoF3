name: BPA 1.4 - signed fake Latest probe APK

on:
  push:
    branches:
      - fix/1.4-theme-preset-custom-isolation
    paths:
      - .github/workflows/test-latest-probe.yml
      - lib/app/app.dart
      - lib/features/app_update/**
      - test/fake_latest_probe_test.dart
      - test/fixtures/fake_latest.json
      - test/fixtures/fake_latest.json.sig
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap existing Android toolchain
        run: bash tool/bootstrap.sh
      - name: Separate this test APK from production BPA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          content = gradle.read_text()
          assert '    buildTypes {' in content
          content = content.replace('    buildTypes {', '''    buildTypes {
                  getByName("debug") {
                      applicationIdSuffix = ".latestprobe"
                  }''', 1)
          gradle.write_text(content)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          assert 'android:label="Better Phenikaa App"' in content
          manifest.write_text(content.replace(
              'android:label="Better Phenikaa App"',
              'android:label="BPA Latest Probe TEST"',
              1,
          ))
          PY
      - name: Verify signed fake fixture
        run: flutter test --no-pub test/fake_latest_probe_test.dart
      - name: Build one independent APK (never publish Latest)
        run: flutter build apk --debug --no-pub --dart-define=BPA_FAKE_UPDATE_TEST=true
      - name: Save separate test APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-1.4-LatestProbe-TEST
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
