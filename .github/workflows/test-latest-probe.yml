name: BPA 1.4 - signed fake Latest probe APK

on:
  push:
    branches:
      - fix/1.4-theme-preset-custom-isolation
    paths:
      - .github/workflows/test-latest-probe.yml
      - lib/app/app.dart
      - lib/app/bpa_pen_trace_splash.dart
      - lib/features/app_update/**
      - test/fake_latest_probe_test.dart
      - test/fixtures/fake_latest.json
      - test/fixtures/fake_latest.json.sig
  workflow_dispatch:

permissions:
  contents: read

# Pushes while fixing the probe replace an in-flight test build;
# they cannot create a queue of repeated APK builds.
concurrency:
  group: bpa-latest-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap existing Android toolchain
        run: bash tool/bootstrap.sh
      - name: Create a separate test identity and test-only release signer
        run: |
          # Keep the test APK installable alongside BPA without production keys.
          keytool -genkeypair -noprompt -keystore android/bpa-latestprobe-test.jks \
            -storepass android -keypass android -alias bpa-test \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=BPA Latest Probe TEST"
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=bpa-test\nstoreFile=bpa-latestprobe-test.jks\n' \
            > android/key.properties
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          content = gradle.read_text()
          assert '        release {' in content
          content = content.replace('        release {', '''        release {
                      applicationIdSuffix = ".latestprobe"''', 1)
          gradle.write_text(content)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          assert 'android:label="Better Phenikaa App"' in content
          manifest.write_text(content.replace(
              'android:label="Better Phenikaa App"',
              'android:label="BPA Latest Probe TEST"',
              1,
          ))
          PY
      - name: Verify signed fake fixture
        run: flutter test --no-pub test/fake_latest_probe_test.dart
      - name: Build one optimized independent APK (never publish Latest)
        run: flutter build apk --release --no-pub --dart-define=BPA_FAKE_UPDATE_TEST=true
      - name: Save separate test APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-1.4-LatestProbe-TEST
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
