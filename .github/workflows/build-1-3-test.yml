name: Build cooc.1.3 private test APK (NO PUBLISH)

on:
  push:
    branches:
      - feature/1.3-attendance-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed_test_apk:
    runs-on: ubuntu-latest
    environment: cooc-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap
        run: bash tool/bootstrap.sh
      - name: Verify attendance model
        run: flutter test test/attendance_flow_test.dart
      - name: Prepare existing cooc signer (never print secrets)
        env:
          COOC_KEYSTORE_BASE64: ${{ secrets.COOC_KEYSTORE_BASE64 }}
          COOC_KEYSTORE_PASSWORD: ${{ secrets.COOC_KEYSTORE_PASSWORD }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          test -n "$COOC_KEYSTORE_BASE64"
          test -n "$COOC_KEYSTORE_PASSWORD"
          test -n "$UPDATE_PUBLIC_KEY_BASE64"
          test -n "$EXPECTED_APK_CERT_SHA256"
          echo "$COOC_KEYSTORE_BASE64" | base64 --decode > android/cooc-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=cooc-release-v2\nstoreFile=cooc-release.jks\n' \
            "$COOC_KEYSTORE_PASSWORD" "$COOC_KEYSTORE_PASSWORD" > android/key.properties
          chmod 600 android/key.properties android/cooc-release.jks
      - name: Build 1.3 APK without publishing
        env:
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/LonelyChromosome/DemoF3/feature/1.2-card-update/updates/latest.json
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          original = path.read_text()
          entry = '  integration_test:\n    sdk: flutter\n'
          assert original.count(entry) == 1
          path.write_text(original.replace(entry, ''))
          PY
          flutter pub get
          COOC_VERSION_NAME=cooc.1.3 flutter build apk --release --build-number=33 \
            --dart-define="UPDATE_PUBLIC_KEY_BASE64=$UPDATE_PUBLIC_KEY_BASE64" \
            --dart-define="UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.3-PRIVATE-TEST.apk
      - name: Verify signer/package/version
        env:
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          apk=dist/Better-Phenikaa-cooc.1.3-PRIVATE-TEST.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          "$signer" verify --print-certs "$apk" > dist/verify-signer.txt
          badging="$("$aapt" dump badging "$apk")"
          [[ "$badging" == *"package: name='vn.edu.phenikaa.better_phenikaa_schedule' versionCode='33' versionName='cooc.1.3'"* ]]
          fingerprint="$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' dist/verify-signer.txt | sort -u)"
          test -n "$fingerprint" && test "${fingerprint,,}" = "${EXPECTED_APK_CERT_SHA256,,}"
          echo "Signed test APK versionCode 33 verified"
          sha256sum "$apk" > dist/SHA256SUMS
      - name: Remove signing materials
        if: always()
        run: |
          rm -f android/key.properties android/cooc-release.jks
      - name: Upload test APK as Actions artifact ONLY
        uses: actions/upload-artifact@v4
        with:
          name: cooc-1-3-private-test-only
          path: |
            dist/Better-Phenikaa-cooc.1.3-PRIVATE-TEST.apk
            dist/SHA256SUMS
          retention-days: 7
