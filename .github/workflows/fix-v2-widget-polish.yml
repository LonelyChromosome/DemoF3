name: Fix Better Phenikaa v2 widget polish

on:
  push:
    branches:
      - main
    paths:
      - 'tool/fix_v2_widget_polish.py'

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final polish
        run: python3 tool/fix_v2_widget_polish.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'animation: controller' lib/theme/app_theme.dart
          grep -q 'Future.wait<bool>' lib/theme/app_theme.dart
          ! grep -q 'saveWidgetData<String>' lib/theme/app_theme.dart
          grep -q 'better-phenikaa://widget/\$widgetId/\$sizeToken")' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'android:background="@android:color/transparent"' platform/android_widget/app/src/main/res/layout/schedule_widget_item.xml
          grep -q 'android:outlineProvider="none"' platform/android_widget/app/src/main/res/layout/schedule_widget_item.xml
          grep -q '^version: 2.0.3+8$' pubspec.yaml

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.3.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.3.apk > dist/Better_Phenikaa_App_v2.0.3.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.3-widget-polish
          path: |
            dist/Better_Phenikaa_App_v2.0.3.apk
            dist/Better_Phenikaa_App_v2.0.3.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add lib/theme/app_theme.dart pubspec.yaml \
            platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt \
            platform/android_widget/app/src/main/res/layout/schedule_widget_item.xml
          git commit -m 'fix: remove widget theme flicker and stale account theme'
          git pull --rebase origin main
          git push origin HEAD:main
