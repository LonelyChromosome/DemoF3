name: BPA 2.0 - KDA and Find Bike production update
on:
  push:
    branches: [main]
    paths: [releases/cooc.2.0.json]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: python3 tool/verify_kda_assets.py
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
      - run: node tool/inline_sync_js_regression.cjs
      - run: node tool/retained_webview_contract.cjs
      - run: node tool/notification_changelog_contract.cjs
      - run: cd android && ./gradlew --no-daemon :app:testDebugUnitTest :findbike:testDebugUnitTest
  release:
    needs: verify
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
    with:
      version_name: cooc.2.0
      version_code: '81'
      notes: |-
        KDA Starter prenium theme
        Find Bike(beta)
      publish: true
      publish_confirmation: PUBLISH
