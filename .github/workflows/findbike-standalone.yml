name: Find My Bike Standalone APK
on:
  push:
    branches:
      - find-bike/**
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble source ZIP
        run: cat findbike_binary/part_*.txt | base64 -d > findbike-source.zip
      - name: Verify ZIP
        run: echo "937ee89c81db8f0dc3b54617391c5100a2fe0287f6d3c9616cdfe4803a75b8eb  findbike-source.zip" | sha256sum -c -
      - name: Unpack standalone app
        run: mkdir -p findbike-build && unzip -q findbike-source.zip -d findbike-build
      - name: Build debug APK
        run: gradle -p findbike-build --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FindMyBike-Standalone-Debug-APK
          path: findbike-build/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
