name: Find My Bike Standalone APK
on:
  push:
    branches:
      - find-bike/**
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore baseline project
        run: |
          cat findbike_binary/part_*.txt | base64 -d > findbike-source.zip
          echo "937ee89c81db8f0dc3b54617391c5100a2fe0287f6d3c9616cdfe4803a75b8eb  findbike-source.zip" | sha256sum -c -
          mkdir -p findbike-build
          unzip -q findbike-source.zip -d findbike-build
      - name: Apply 0.2 navigation, graph, hi-res map
        run: |
          echo "7370507322a17693892417da2cfae182527b6393531c430381cb649724b25d9a  findbike_binary/v02_update.tar.gz" | sha256sum -c -
          tar -xzf findbike_binary/v02_update.tar.gz -C findbike-build
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image,ImageFilter
          from pathlib import Path
          assets=Path("findbike-build/app/src/main/assets")
          path=assets/"map_native.webp"
          original=Image.open(path).convert("RGB")
          large=original.resize((original.width*3, original.height*3), Image.Resampling.LANCZOS)
          large=large.filter(ImageFilter.UnsharpMask(radius=1.8,percent=115,threshold=3))
          large.save(assets/"map_hires.webp",format="WEBP",lossless=True,method=6)
          path.unlink()
          (assets/"map.webp").unlink(missing_ok=True)
          print("Generated", (assets/"map_hires.webp").stat().st_size,"bytes")
          PY
      - name: Apply v0.3 adaptive walking route
        run: python findbike_overrides/apply_v03.py
      - name: Apply v0.4 lane-first and animated steps
        run: python findbike_overrides/apply_v04.py
      - name: Build grey-building obstacle mask
        run: |
          python -m pip install --quiet numpy opencv-python-headless
          python findbike_overrides/generate_blocked_mask.py
      - name: Apply v0.5 obstacle-aware walking and safe lane navigation
        run: python findbike_overrides/apply_v05.py
      - name: Apply v0.6 obstacle-safe pedestrian routing
        run: |
          python findbike_overrides/apply_v06.py
          echo "0124dd43a0f4d84e7b094e57dd9aa1d74f21f0317a403b1fd7175df47372b620  findbike-build/app/src/main/java/com/bpa/findbike/WalkRouter.java" | sha256sum -c -
          echo "96b8ef4a8a0bfe1813c876bee1f77721717662ac0701bcdd4c6a6ee5bf2877d8  findbike-build/app/src/main/assets/road_painted.bin" | sha256sum -c -
      - name: Build debug APK
        run: gradle -p findbike-build --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FindMyBike-v0.6-Debug-APK
          path: findbike-build/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
