name: Build cooc.1.3 isolated preview (NO PUBLISH)

on:
  push:
    branches:
      - fix/1.3-shared-sync-352e5a0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private test branch
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap project
        run: bash tool/bootstrap.sh
      - name: Attendance and feedback tests
        run: flutter test test/attendance_flow_test.dart test/attendance_feedback_test.dart
      - name: Verify a single QLDT auth path
        run: |
          grep -q "buildQldtInlineSync" lib/app/app.dart
          grep -q "buildQldtInlineSession" lib/app/app.dart
          ! grep -q "reloadQldtInPlace" lib/app/app.dart
          ! grep -q "_readAttendanceSession" lib/features/diem_danh/attendance_submit_io.dart
      - name: Build side-by-side debug APK, NOT an in-place upgrade
        run: |
          flutter build apk --debug --split-per-abi --build-number=34
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk dist/Better-Phenikaa-cooc.1.3-Preview-arm64.apk
      - name: Verify APK identity
        run: |
          apk=dist/Better-Phenikaa-cooc.1.3-Preview-arm64.apk
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$apk" | grep "vn.edu.phenikaa.better_phenikaa_schedule.preview13"
          sha256sum "$apk" > dist/SHA256SUMS
      - name: Upload preview artifact only
        uses: actions/upload-artifact@v4
        with:
          name: cooc-1-3-preview-side-by-side
          path: |
            dist/Better-Phenikaa-cooc.1.3-Preview-arm64.apk
            dist/SHA256SUMS
          retention-days: 7
