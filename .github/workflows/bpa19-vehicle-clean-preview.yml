name: BPA 1.9 Xe co Clean Preview
on:
  push:
    branches:
      - feature/bpa19-vehicle-production-clean
    paths:
      - 'lib/**'
      - 'android/**'
      - '.github/workflows/bpa19-vehicle-clean-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-arm64-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Prepare Android tooling
        run: bash tool/bootstrap.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze clean screen
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/features/phuong_tien/ lib/app/app.dart
      - name: Build clean Android arm64 preview
        run: flutter build apk --profile --target-platform android-arm64 --split-per-abi --no-pub --dart-define=BPA_VEHICLE_TEST_PANEL=false
      - name: Verify signed APK and receivers
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs/flutter-apk -type f -name '*arm64*profile.apk' | head -1)
          test -n "$APK" && test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F 'vn.edu.phenikaa.better_phenikaa_schedule.vehicle.preview19'
          for component in VehicleCaptureService VehicleScheduleReceiver VehicleFenceReceiver VehicleExitNotificationListener; do
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "$component"
          done
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK" | tail -n 2
          mkdir -p build/verified
          cp "$APK" build/verified/BPA-1.9-Xe-co-Clean-Preview-arm64.apk
          (cd build/verified && sha256sum BPA-1.9-Xe-co-Clean-Preview-arm64.apk > SHA256.txt)
          ls -lah build/verified
      - name: Upload clean preview APK
        uses: actions/upload-artifact@v4
        with:
          name: BPA-1.9-Xe-co-Clean-Preview-APK
          path: build/verified/
          compression-level: 0
          retention-days: 30
