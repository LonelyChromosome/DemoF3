name: Fix Better Phenikaa v2 StackView and contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v2-stack-contrast.yml'

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply StackView and contrast repair
        run: python3 tool/fix_v2_stack_contrast.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify targeted repairs
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'canvas.drawRect(0f, 0f, widthPx, heightPx, backgroundPaint)' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -q 'themeChanged' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'notifyAppWidgetViewDataChanged(widgetId, R.id.widget_list)' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q '_contrastForeground(color)' lib/app/app.dart
          grep -q '_panelSecondaryColor(palette)' lib/app/app.dart
          grep -q '_panelTertiaryColor(palette)' lib/app/app.dart
          grep -q '^version: 2.0.6+11$' pubspec.yaml
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.6.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.6.apk > dist/Better_Phenikaa_App_v2.0.6.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.6-stack-contrast
          path: |
            dist/Better_Phenikaa_App_v2.0.6.apk
            dist/Better_Phenikaa_App_v2.0.6.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add lib/app/app.dart pubspec.yaml platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          git commit -m 'fix: prevent StackView bleed and improve theme action contrast'
          git push origin HEAD:main
