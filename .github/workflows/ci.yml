name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Apply safe Dart fixes
        run: dart fix --apply

      - name: Format sources
        run: dart format lib test

      - name: Capture Dart fixes
        run: |
          mkdir -p build/ci
          git diff --binary -- lib test > build/ci/dart-fix.patch

      - name: Upload Dart fix patch
        uses: actions/upload-artifact@v4
        with:
          name: dart-fix-patch
          path: build/ci/dart-fix.patch

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Native Android tests
        run: cd android && ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: flutter build apk --debug
