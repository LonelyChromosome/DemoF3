name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Check formatting
        run: |
          dart format lib/features/giao_dien/xem_truoc/custom_theme_editor.dart test/theme_font_layout_test.dart
          git diff -- lib/features/giao_dien/xem_truoc/custom_theme_editor.dart test/theme_font_layout_test.dart
          exit 1

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: TraCuu browser-flow simulation
        run: node --test tool/tracuu_probe_test.cjs

      - name: TraCuu verified API simulation
        run: node --test tool/tracuu_api_flow_test.cjs

      - name: TraCuu inspector redaction
        run: node --test tools/tracuu_inspector/capture_test.cjs

      - name: Native Android tests
        run: cd android && ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DemoF3-big-update-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
