name: Publish already signed BPA 1.5 artifact

# One-time publication recovery: do not rebuild an already verified signed APK.
on:
  push:
    branches: [fix/1.4-theme-preset-custom-isolation]
    paths:
      - ".github/workflows/publish-bpa-1.5-artifact.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish-existing:
    if: github.repository == 'LonelyChromosome/DemoF3' && github.ref == 'refs/heads/fix/1.4-theme-preset-custom-isolation'
    runs-on: ubuntu-latest
    environment: cooc-release
    steps:
      - uses: actions/checkout@v5
      - name: Download already built, officially signed APK and manifest
        uses: actions/download-artifact@v4
        with:
          name: feature-updater-cooc.1.5-44
          run-id: 38050233485
          github-token: ${{ github.token }}
          path: dist
      - name: Validate signed artifact and publish to existing updater channel
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          apk='dist/Better-Phenikaa-cooc.1.5-Public.apk'
          tag='cooc.1.5-build-11a118212929'
          test -f "$apk" && test -f dist/latest.json && test -f dist/latest.json.sig
          # SHA256SUMS was generated from repository root and contains dist/ prefix.
          sha256sum --check dist/SHA256SUMS
          test -n "$UPDATE_PUBLIC_KEY_BASE64"
          # Independently verify the detached Ed25519 signature.
          printf '302a300506032b6570032100' | xxd -r -p > "$RUNNER_TEMP/update-pub.der"
          printf %s "$UPDATE_PUBLIC_KEY_BASE64" | base64 -d >> "$RUNNER_TEMP/update-pub.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/update-pub.der" -out "$RUNNER_TEMP/update-pub.pem"
          base64 -d dist/latest.json.sig > "$RUNNER_TEMP/update.sig"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update-pub.pem" -rawin -in dist/latest.json -sigfile "$RUNNER_TEMP/update.sig"
          git fetch origin refs/heads/feature/1.2-card-update:refs/remotes/origin/feature/1.2-card-update
          git show origin/feature/1.2-card-update:updates/latest.json > "$RUNNER_TEMP/current-latest.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = json.loads(Path('dist/latest.json').read_bytes())
          previous = json.loads((Path(os.environ['RUNNER_TEMP'])/'current-latest.json').read_bytes())
          apk = Path('dist/Better-Phenikaa-cooc.1.5-Public.apk')
          expected = 'https://github.com/LonelyChromosome/DemoF3/releases/download/cooc.1.5-build-11a118212929/Better-Phenikaa-cooc.1.5-Public.apk'
          assert data['schema'] == 1
          assert data['packageName'] == 'vn.edu.phenikaa.better_phenikaa_schedule'
          assert data['versionName'] == 'cooc.1.5'
          assert data['versionCode'] == 44 and data['versionCode'] > previous['versionCode']
          assert data['minimumVersionCode'] == 30
          assert data['apkSha256'] == hashlib.sha256(apk.read_bytes()).hexdigest()
          assert data['apkSize'] == apk.stat().st_size
          assert data['apkUrl'] == expected
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$tag" "$apk" --target 9ad9cddbcdbb49707cfbeb0ae124db85b7b224aa \
            --title 'Better Phenikaa cooc.1.5' \
            --notes 'cooc.1.5: VFX và kiểm tra cập nhật khi mở app; không phát lại khi trở về từ đa tác vụ.'
          git switch -C publish-feature-updater-feed origin/feature/1.2-card-update
          mkdir -p updates
          cp dist/latest.json dist/latest.json.sig updates/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json updates/latest.json.sig
          git commit -m 'Publish signed cooc.1.5 Feature Updater metadata'
          git push origin HEAD:refs/heads/feature/1.2-card-update
