name: Find Bike NorthUp AutoNav 2.0.1 APK
on:
  push:
    branches:
      - find-bike/north-up-2.0.1-autonav
    paths:
      - 'findbike-trace-return/**'
      - '.github/workflows/findbike-northup-autonav.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Compile NorthUp AutoNav APK
        run: gradle -p findbike-trace-return --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FindBike-NorthUp-2.0.1-AutoNav-APK
          path: findbike-trace-return/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
