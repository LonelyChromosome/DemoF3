name: Build signed cooc.1.3 real NFC and hold VFX - NO PUBLISH

on:
  push:
    branches:
      - feature/1.2-card-update
    paths:
      - .github/workflows/build-cooc-1-3-real-vfx-once.yml

permissions:
  contents: read

jobs:
  apk:
    environment: cooc-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved 1.3 VFX source
        uses: actions/checkout@v5
        with:
          ref: fa218820908b6a6bc2d1579e12de3dff238f8854
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap once
        run: bash tool/bootstrap.sh
      - name: Ensure real VFX only, no preview authorization
        run: |
          set -euo pipefail
          grep -q 'class HenshinVfx' lib/features/app_update/henshin_vfx.dart
          grep -q 'startManualAfterHold' lib/features/app_update/update_ui.dart
          ! grep -q 'COOC_13_VFX_PREVIEW' lib/features/app_update/update_ui.dart
          ! grep -q 'Xem thử VFX' lib/features/app_update/update_ui.dart
          ! grep -q '_demoNfc' lib/features/app_update/update_ui.dart
          test ! -f .github/workflows/build-1-3-vfx-preview.yml
      - name: Prepare trusted cooc release signer
        env:
          KEY_BASE64: ${{ secrets.COOC_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.COOC_KEYSTORE_PASSWORD }}
          PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEY_BASE64" && test -n "$KEY_PASSWORD"
          test -n "$PUBLIC_KEY" && test -n "$CERT_SHA256"
          echo "$KEY_BASE64" | base64 --decode > android/cooc-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=cooc-release-v2\nstoreFile=cooc-release.jks\n' \
            "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties android/cooc-release.jks
      - name: Build only one signed cooc.1.3 APK
        env:
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/LonelyChromosome/DemoF3/feature/1.2-card-update/updates/latest.json
        run: |
          set -euo pipefail
          # Strip dev-only integration_test from the release runner only.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text()
          entry='  integration_test:\n    sdk: flutter\n'
          assert s.count(entry)==1
          p.write_text(s.replace(entry,''))
          PY
          flutter pub get
          COOC_VERSION_NAME=cooc.1.3 flutter build apk --release --build-number=34 \
            --dart-define="UPDATE_PUBLIC_KEY_BASE64=$UPDATE_PUBLIC_KEY_BASE64" \
            --dart-define="UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.3-RealNFC-VFX.apk
      - name: Verify package identity and cooc certificate
        env:
          CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=dist/Better-Phenikaa-cooc.1.3-RealNFC-VFX.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --print-certs "$apk" > dist/signing.txt
          info="$("$aapt" dump badging "$apk")"
          [[ "$info" == *"package: name='vn.edu.phenikaa.better_phenikaa_schedule' versionCode='34' versionName='cooc.1.3'"* ]]
          fingerprint="$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' dist/signing.txt | sort -u)"
          test -n "$fingerprint" && test "${fingerprint,,}" = "${CERT_SHA256,,}"
          ! grep -q 'CN=Android Debug' dist/signing.txt
          sha256sum "$apk" > dist/SHA256SUMS
      - name: Erase signing secrets
        if: always()
        run: rm -f android/cooc-release.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: cooc-1-3-real-nfc-manual-vfx-signed-NOT-PUBLISHED
          path: |
            dist/Better-Phenikaa-cooc.1.3-RealNFC-VFX.apk
            dist/SHA256SUMS
          retention-days: 14
