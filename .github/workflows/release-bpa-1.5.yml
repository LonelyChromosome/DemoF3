name: Publish Better Phenikaa 1.5

# One-time handoff to the established, signed production release workflow.
# The push path is this NEW file, so later app changes cannot republish 1.5.
on:
  push:
    branches: [fix/1.4-theme-preset-custom-isolation]
    paths:
      - ".github/workflows/release-bpa-1.5.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-signed-release:
    if: github.repository == 'LonelyChromosome/DemoF3' && github.ref == 'refs/heads/fix/1.4-theme-preset-custom-isolation'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch established updater release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run build-apk.yml --ref fix/1.4-theme-preset-custom-isolation \
            -f version_name=cooc.1.5 \
            -f version_code=44 \
            -f notes='cooc.1.5: VFX và kiểm tra cập nhật khi mở app; không phát lại khi trở về từ đa tác vụ.' \
            -f publish=true \
            -f publish_confirmation=PUBLISH
