name: Notification Center verification

on:
  push:
    branches:
      - feature/big-update
    paths:
      - '.github/workflows/notification-center-verify-temp.yml'
      - 'lib/**'
      - 'test/**'
      - 'android/app/src/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: dart format lib test
      - run: zip -q nc-formatted.zip lib/app/app.dart lib/features/tro_li/assistant_text.dart test/app_smoke_test.dart test/exam_period_ui_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: notification-center-formatted
          path: nc-formatted.zip
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: cd android && ./gradlew :app:testDebugUnitTest
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: notification-center-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
