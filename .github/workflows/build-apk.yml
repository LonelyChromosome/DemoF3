name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/date-schedule-markers

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Verify standalone main source
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/tien_mon_premium/app_backgrounds/tienmon_1_1440x2560.png
          test -f assets/tien_mon_premium/app_backgrounds/tienmon_8_1440x2560.png
          test -f assets/tien_mon_premium/fonts/FzCoTrang.ttf
          test -f assets/tien_mon_premium/widget_overview/wid_sang.png
          test -f android/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/NativeQldtWidgetSync.kt
          grep -F 'ValueNotifier<bool> _weeklyMode' lib/app/app.dart
          grep -F 'builder: (context, weekly, _) => IndexedStack(' lib/app/app.dart
          grep -F 'applyPendingSelection' android/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          ! grep -F 'pinSelectedFirst()' android/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/WidgetSnapshotStore.kt
          test -x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar

      - name: Build public APK
        run: flutter build apk --release

      - name: Package public APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.1-Public.apk

      - name: Build assistant-panel APK
        run: flutter build apk --release --dart-define=ASSISTANT_TEST_PANEL=true

      - name: Package assistant-panel APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.1-Panel.apk
          sha256sum dist/Better-Phenikaa-cooc.1.1-Public.apk > dist/Better-Phenikaa-cooc.1.1-Public.sha256
          sha256sum dist/Better-Phenikaa-cooc.1.1-Panel.apk > dist/Better-Phenikaa-cooc.1.1-Panel.sha256

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: better-phenikaa-cooc-1-1
          path: |
            dist/Better-Phenikaa-cooc.1.1-Public.apk
            dist/Better-Phenikaa-cooc.1.1-Public.sha256
            dist/Better-Phenikaa-cooc.1.1-Panel.apk
            dist/Better-Phenikaa-cooc.1.1-Panel.sha256
          retention-days: 14
          if-no-files-found: error
