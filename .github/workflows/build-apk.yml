name: Build APK

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.path != ".github/workflows/build-apk.yml") | .id'           | while read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Deleting obsolete workflow run $run_id"
              gh api --method DELETE "repos/$REPO/actions/runs/$run_id" || true
            done
