name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap
        run: bash tool/bootstrap.sh

      - name: Prepare cooc release signing
        env:
          COOC_KEYSTORE_BASE64: ${{ secrets.COOC_KEYSTORE_BASE64 }}
          COOC_KEYSTORE_PASSWORD: ${{ secrets.COOC_KEYSTORE_PASSWORD }}
        run: |
          test -n "$COOC_KEYSTORE_BASE64"
          test -n "$COOC_KEYSTORE_PASSWORD"
          echo "$COOC_KEYSTORE_BASE64" | base64 --decode > android/cooc-release.jks
          cat > android/key.properties <<EOF
          storePassword=$COOC_KEYSTORE_PASSWORD
          keyPassword=$COOC_KEYSTORE_PASSWORD
          keyAlias=cooc
          storeFile=cooc-release.jks
          EOF

      - name: Build Public
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.1-Public.apk

      - name: Build Dev
        run: |
          flutter build apk --release --dart-define=ASSISTANT_TEST_PANEL=true
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.1-Dev.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: better-phenikaa-cooc-1-1
          path: |
            dist/Better-Phenikaa-cooc.1.1-Public.apk
            dist/Better-Phenikaa-cooc.1.1-Dev.apk
          retention-days: 14
