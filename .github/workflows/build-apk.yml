name: Build cooc releases

on:
  workflow_dispatch:
    inputs:
      publish_bootstrap_only:
        description: 'Publish the signed 1.1 APK from verified run #184 without rebuilding'
        type: boolean
        default: false

jobs:
  release:
    if: ${{ !inputs.publish_bootstrap_only }}
    # Release secrets remain scoped to the cooc-release environment.
    environment: cooc-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap release dependencies
        run: bash tool/bootstrap.sh
      - name: Prepare protected signing material
        env:
          COOC_KEYSTORE_BASE64: ${{ secrets.COOC_KEYSTORE_BASE64 }}
          COOC_KEYSTORE_PASSWORD: ${{ secrets.COOC_KEYSTORE_PASSWORD }}
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          test -n "$COOC_KEYSTORE_BASE64"
          test -n "$COOC_KEYSTORE_PASSWORD"
          test -n "$UPDATE_MANIFEST_PRIVATE_KEY_BASE64"
          test -n "$UPDATE_PUBLIC_KEY_BASE64"
          test -n "$EXPECTED_APK_CERT_SHA256"
          echo "$COOC_KEYSTORE_BASE64" | base64 --decode > android/cooc-release.jks
          echo "$UPDATE_MANIFEST_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/update-manifest-private.pem"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=cooc-release-v2\nstoreFile=cooc-release.jks\n' \
            "$COOC_KEYSTORE_PASSWORD" "$COOC_KEYSTORE_PASSWORD" > android/key.properties
          chmod 600 android/key.properties android/cooc-release.jks "$RUNNER_TEMP/update-manifest-private.pem"
          derived_public="$(openssl pkey -in "$RUNNER_TEMP/update-manifest-private.pem" -pubout -outform DER | tail -c 32 | base64 -w 0)"
          test "$derived_public" = "$UPDATE_PUBLIC_KEY_BASE64"
      - name: Build signed 1.1 bootstrap and 1.2 target
        env:
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
          UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/LonelyChromosome/DemoF3/feature/1.2-card-update/updates/latest.json
        run: |
          # Flutter's generated registrant includes this dev-only plugin, but
          # Gradle does not package its class in a release APK.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text()
          entry = '  integration_test:\n    sdk: flutter\n'
          assert text.count(entry) == 1
          path.write_text(text.replace(entry, ''))
          PY
          flutter pub get
          mkdir -p dist/update-host/updates
          COOC_VERSION_NAME=cooc.1.1 flutter build apk --release --build-number=30 \
            --dart-define="UPDATE_PUBLIC_KEY_BASE64=$UPDATE_PUBLIC_KEY_BASE64" \
            --dart-define="UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL"
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.1-Public.apk
          flutter clean
          flutter pub get
          COOC_VERSION_NAME=cooc.1.2 flutter build apk --release --build-number=32 \
            --dart-define="UPDATE_PUBLIC_KEY_BASE64=$UPDATE_PUBLIC_KEY_BASE64" \
            --dart-define="UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL"
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-cooc.1.2-Public.apk
          cp dist/Better-Phenikaa-cooc.1.2-Public.apk dist/update-host/updates/
      - name: Verify identity and sign exact manifest bytes
        env:
          UPDATE_APK_URL: https://github.com/LonelyChromosome/DemoF3/releases/download/cooc.1.2-card-fix-3/Better-Phenikaa-cooc.1.2-Public.apk
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner_bin" && test -x "$aapt_bin"
          for version in 1.1 1.2; do
            apk="dist/Better-Phenikaa-cooc.$version-Public.apk"
            "$apksigner_bin" verify --print-certs "$apk" > "dist/cooc.$version-signing.txt"
            code=30
            if test "$version" = 1.2; then code=32; fi
            badging="$("$aapt_bin" dump badging "$apk")"
            echo "cooc.$version APK package metadata:"
            printf '%s\\n' "$badging" | grep '^package:'
            echo "cooc.$version signing fingerprint:"
            grep 'certificate SHA-256 digest' "dist/cooc.$version-signing.txt"
            [[ "$badging" == *"package: name='vn.edu.phenikaa.better_phenikaa_schedule' versionCode='$code' versionName='cooc.$version'"* ]]
            sha256sum "$apk" >> dist/SHA256SUMS
          done
          fingerprint11="$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' dist/cooc.1.1-signing.txt | sort -u)"
          fingerprint12="$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' dist/cooc.1.2-signing.txt | sort -u)"
          test -n "$fingerprint11" && test "$fingerprint11" = "$fingerprint12"
          test "$fingerprint11" != ad3b3b92c1376f2a2026b7fcdd6da41a7319d334c9dbf5a5378c58408382ab58
          ! grep -q 'CN=Android Debug' dist/cooc.1.1-signing.txt
          ! grep -q 'CN=Android Debug' dist/cooc.1.2-signing.txt
          test "${fingerprint11,,}" = "${EXPECTED_APK_CERT_SHA256,,}"
          echo "APK certificate SHA-256: $fingerprint11"
          python3 tool/release_update_manifest.py \
            dist/update-host/updates/Better-Phenikaa-cooc.1.2-Public.apk \
            "$UPDATE_APK_URL" \
            dist/update-host/updates/latest.json
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/update-manifest-private.pem" \
            -in dist/update-host/updates/latest.json -out "$RUNNER_TEMP/latest.sig.bin"
          base64 -w 0 "$RUNNER_TEMP/latest.sig.bin" > dist/update-host/updates/latest.json.sig
          sha256sum dist/update-host/updates/latest.json dist/update-host/updates/latest.json.sig >> dist/SHA256SUMS
      - name: Delete signing material
        if: always()
        run: |
          rm -f android/key.properties android/cooc-release.jks
          rm -f "$RUNNER_TEMP/update-manifest-private.pem" "$RUNNER_TEMP/latest.sig.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: better-phenikaa-cooc-1-1-bootstrap
          path: dist/Better-Phenikaa-cooc.1.1-Public.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: better-phenikaa-cooc-1-2-and-update-host
          path: |
            dist/Better-Phenikaa-cooc.1.2-Public.apk
            dist/update-host/updates/latest.json
            dist/update-host/updates/latest.json.sig
            dist/SHA256SUMS
          retention-days: 14

  publish:
    if: ${{ !inputs.publish_bootstrap_only }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: better-phenikaa-cooc-1-2-and-update-host
          path: dist
      - name: Verify hosted package before publishing
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path('dist/Better-Phenikaa-cooc.1.2-Public.apk')
          manifest = json.loads(Path('dist/update-host/updates/latest.json').read_bytes())
          assert manifest['packageName'] == 'vn.edu.phenikaa.better_phenikaa_schedule'
          assert manifest['versionName'] == 'cooc.1.2'
          assert manifest['versionCode'] == 32
          assert manifest['minimumVersionCode'] == 30
          assert manifest['apkSha256'] == hashlib.sha256(apk.read_bytes()).hexdigest()
          assert manifest['apkSize'] == apk.stat().st_size
          assert Path('dist/update-host/updates/latest.json.sig').stat().st_size > 0
          PY
      - name: Publish signed APK and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=cooc.1.2-card-fix-3
          apk=dist/Better-Phenikaa-cooc.1.2-Public.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "Better Phenikaa cooc.1.2 (versionCode 32)" \
              --notes "Signed update candidate for cooc.1.1 versionCode 30." --prerelease
          fi
          mkdir -p updates
          cp dist/update-host/updates/latest.json dist/update-host/updates/latest.json.sig updates/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json updates/latest.json.sig
          git commit -m "Publish signed cooc.1.2 update metadata"
          git push origin HEAD:refs/heads/feature/1.2-card-update

  bootstrap:
    if: ${{ inputs.publish_bootstrap_only }}
    environment: cooc-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: better-phenikaa-cooc-1-1-bootstrap
          run-id: 37736104972
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: better-phenikaa-cooc-1-2-and-update-host
          run-id: 37736104972
          github-token: ${{ github.token }}
          path: dist
      - name: Verify existing signed release artifacts
        env:
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          sha256sum -c dist/SHA256SUMS
          apk=dist/Better-Phenikaa-cooc.1.1-Public.apk
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner_bin" && test -x "$aapt_bin"
          "$apksigner_bin" verify --print-certs "$apk" > dist/cooc.1.1-signing.txt
          badging="$("$aapt_bin" dump badging "$apk")"
          [[ "$badging" == *"package: name='vn.edu.phenikaa.better_phenikaa_schedule' versionCode='30' versionName='cooc.1.1'"* ]]
          fingerprint="$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' dist/cooc.1.1-signing.txt | sort -u)"
          test -n "$fingerprint" && test "${fingerprint,,}" = "${EXPECTED_APK_CERT_SHA256,,}"
          echo "cooc.1.1 signer SHA-256: $fingerprint"
      - name: Save verified bootstrap for release publishing
        uses: actions/upload-artifact@v4
        with:
          name: verified-cooc-1-1-direct
          path: dist/Better-Phenikaa-cooc.1.1-Public.apk
          retention-days: 1

  bootstrap_publish:
    if: ${{ inputs.publish_bootstrap_only }}
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-cooc-1-1-direct
          path: dist
      - name: Publish direct cooc.1.1 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=cooc.1.1-bootstrap-v30
          apk=dist/Better-Phenikaa-cooc.1.1-Public.apk
          test -s "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target 6a3e9d1512cdd6ffbd0bc378eba53b22f8afe1a3 \
              --title "Better Phenikaa cooc.1.1 bootstrap (versionCode 30)" \
              --notes "Updater-capable 1.1 build signed with the fixed release certificate." --prerelease
          fi
