name: Build APK

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Final Actions cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          gh api --method POST "repos/$REPO/actions/runs/37612712502/cancel" >/dev/null 2>&1 || true

          gh api "repos/$REPO/actions/workflows?per_page=100"             --jq '.workflows[] | select(.path != ".github/workflows/build-apk.yml") | .id'           | while read -r workflow_id; do
              [ -n "$workflow_id" ] || continue
              gh api "repos/$REPO/actions/workflows/$workflow_id/runs?per_page=100"                 --jq '.workflow_runs[].id' 2>/dev/null               | while read -r run_id; do
                  [ -n "$run_id" ] || continue
                  gh api --method DELETE "repos/$REPO/actions/runs/$run_id" >/dev/null 2>&1 || true
                done
            done
