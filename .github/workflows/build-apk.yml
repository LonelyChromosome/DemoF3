name: Build APK

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflow_ids="$(
            gh api --paginate "repos/$REPO/actions/workflows?per_page=100"               --jq '.workflows[] | select(.path != ".github/workflows/build-apk.yml") | .id'
          )"
          for workflow_id in $workflow_ids; do
            echo "Cleaning workflow $workflow_id"
            while true; do
              run_ids="$(
                gh api "repos/$REPO/actions/workflows/$workflow_id/runs?per_page=100"                   --jq '.workflow_runs[].id' || true
              )"
              [ -n "$run_ids" ] || break
              for run_id in $run_ids; do
                echo "Deleting run $run_id"
                for attempt in 1 2 3; do
                  if gh api --method DELETE "repos/$REPO/actions/runs/$run_id"; then
                    break
                  fi
                  sleep 1
                done
              done
            done
          done
