name: BPA 1.7 - fake card layout APK (no publish)

on:
  push:
    branches:
      - test/bpa17-card-layout-fake

permissions:
  contents: read

concurrency:
  group: bpa17-layout-only
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap Android
        run: bash tool/bootstrap.sh
      - name: Check standalone fake layout
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/fake_badge_alarm_main.dart lib/app/app.dart
          flutter test test/fake_badge_alarm_screen_test.dart
      - name: Isolate installable package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          content = p.read_text()
          old = 'applicationId = "vn.edu.phenikaa.better_phenikaa_schedule"'
          assert content.count(old) == 1
          p.write_text(content.replace(old,
              'applicationId = "vn.edu.phenikaa.better_phenikaa_schedule.bpa17layout"'))
          p = Path('android/app/src/main/AndroidManifest.xml')
          content = p.read_text()
          old = 'android:label="Better Phenikaa App"'
          assert content.count(old) == 1
          p.write_text(content.replace(old, 'android:label="BPA 1.7 UI Test"'))
          PY
      - name: Build fake screen APK (ARM64)
        run: |
          COOC_VERSION_NAME=cooc.1.7.layout flutter build apk --profile --target lib/fake_badge_alarm_main.dart --target-platform android-arm64 --build-name=1.7.0 --build-number=53
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-profile.apk dist/BPA-1.7-Fake-Card-Alarm.apk
          sha256sum dist/BPA-1.7-Fake-Card-Alarm.apk > dist/SHA256SUMS
      - name: Verify standalone install
        run: |
          set -euo pipefail
          apk=dist/BPA-1.7-Fake-Card-Alarm.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          "$signer" verify "$apk"
          "$aapt" dump badging "$apk" | grep -F "package: name='vn.edu.phenikaa.better_phenikaa_schedule.bpa17layout'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'BPA 1.7 UI Test'"
      - uses: actions/upload-artifact@v4
        with:
          name: BPA-1.7-Fake-Card-Alarm
          path: |
            dist/BPA-1.7-Fake-Card-Alarm.apk
            dist/SHA256SUMS
          retention-days: 14
