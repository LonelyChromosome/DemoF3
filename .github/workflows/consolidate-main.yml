name: Consolidate repository to main
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Archive and verify first, then clean up after successful main release
        required: true
        type: choice
        options:
          - prepare
          - cleanup
permissions:
  contents: write
  actions: read
concurrency:
  group: cooc-repository-maintenance
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Archive branches or finish main consolidation
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.phase }}
        run: python3 tool/consolidate_branches.py "$PHASE"
